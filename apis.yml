name: Airspace Intelligence
description: 'Air Space Intelligence (ASI) builds AI software for mission-critical, geospatial
  operations across aviation, defense, logistics, and energy. Its Prescience platform fuses
  data, models operational domains, runs predictive simulations, and optimizes complex operations
  in real time — spanning airline operations, air traffic management, global logistics, defense
  (space, air, land, sea), and energy grids. ASI holds an $875M FAA contract to help modernize
  the U.S. National Airspace System and works with partners including Alaska Airlines, National
  Grid, and the U.S. Air Force. As of this profile the company publishes no public developer
  API, OpenAPI specification, or developer portal.'
